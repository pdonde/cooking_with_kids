<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noodle Kitchen</title>
<meta name="description" content="A picture checklist for cooking noodles with a toddler, with animations, sound effects and a spoken voice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: illustrated kitchen stage on the left (sticky), numbered checklist on the right; on phones the stage pins to the top and the list scrolls beneath it */
:root{
  --bg:#EDF4F2;
  --surface:#FFFFFF;
  --ink:#1E2A3B;
  --muted:#586A73;
  --line:#CFDFDB;
  --accent:#0E7C73;
  --accent-ink:#FFFFFF;
  --noodle:#F6C945;
  --noodle-deep:#C98E0F;
  --next:#FFF4CF;
  --warn-bg:#FFE6DA;
  --warn-ink:#A33E1C;
  --stage-bg:#D6ECEE;
  --toast-bg:#1E2A3B;
  --toast-ink:#FFFFFF;
  --font-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121E1D; --surface:#1A2A29; --ink:#E6F0EE; --muted:#9CB2AE; --line:#2B403D;
    --accent:#3BBFB1; --accent-ink:#0B1A19; --noodle:#F6C945; --noodle-deep:#E9B930;
    --next:#2D2A16; --warn-bg:#3A2219; --warn-ink:#FFB496; --stage-bg:#D6ECEE;
    --toast-bg:#E6F0EE; --toast-ink:#121E1D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121E1D; --surface:#1A2A29; --ink:#E6F0EE; --muted:#9CB2AE; --line:#2B403D;
  --accent:#3BBFB1; --accent-ink:#0B1A19; --noodle:#F6C945; --noodle-deep:#E9B930;
  --next:#2D2A16; --warn-bg:#3A2219; --warn-ink:#FFB496; --stage-bg:#D6ECEE;
  --toast-bg:#E6F0EE; --toast-ink:#121E1D; color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.brand{min-width:0}
.tools{display:flex;flex-wrap:wrap;gap:8px}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(2rem,5vw,2.75rem);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);max-width:52ch}
.progress{display:flex;align-items:center;gap:14px;margin-block:16px 22px}
.noodle-bar{flex:1;min-width:0;height:24px;display:block;overflow:visible}
.noodle-bar path{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}
#barTrack{stroke:var(--line);stroke-width:7}
#barFill{stroke:var(--noodle);stroke-width:7;stroke-dasharray:0 100;transition:stroke-dasharray .6s cubic-bezier(.3,.8,.3,1)}
#progressText{font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}

/* Buttons */
.pill{font:inherit;font-weight:700;font-size:.92rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pill:hover{border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.pill svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Layout */
.layout{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){
  .layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .stage-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
}

/* Stage */
.stage{position:relative;margin:0;border-radius:22px;overflow:hidden;background:var(--stage-bg);aspect-ratio:4/3;max-width:100%;box-shadow:0 1px 0 rgba(0,0,0,.04),0 10px 30px -14px rgba(20,60,60,.35)}
#scene,#scene svg{display:block;width:100%;height:100%}
.replay{position:absolute;right:12px;top:12px;background:#FFFFFF;color:#1E2A3B;border-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-ink);padding:10px 18px;border-radius:999px;font-weight:700;font-size:.95rem;max-width:calc(100% - 32px);text-align:center;animation:toastIn .3s cubic-bezier(.3,1.5,.5,1) both}
@keyframes toastIn{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.caption{padding:16px 4px 0;display:grid;gap:4px}
.cap-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#capStep{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
#capTitle{font-family:var(--font-display);font-weight:600;font-size:1.6rem;line-height:1.15;margin:0;text-wrap:balance}
#capHint{margin:0;color:var(--muted);font-size:1.05rem}
@media (max-width:859px){
  .stage-col{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding-inline:16px;padding-block:8px 10px;border-bottom:1px solid var(--line)}
  .stage{aspect-ratio:auto;height:min(calc((100vw - 32px) * .75),38vh);border-radius:18px}
  .caption{padding-top:10px}
  #capTitle{font-size:1.25rem}
  #capHint{display:none}
}

/* Picture checklist */
.tiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
[hidden]{display:none!important}
.tile{position:relative;display:block;width:100%;aspect-ratio:4/3;max-width:100%;padding:0;border-radius:18px;border:4px solid var(--surface);background:var(--stage-bg);cursor:pointer;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.04),0 6px 16px -10px rgba(20,60,60,.45);transition:transform .15s ease,border-color .2s,opacity .25s,filter .25s}
.tile:hover{transform:translateY(-2px)}
.tile:active{transform:scale(.97)}
.tile > svg{display:block;width:100%;height:100%}
.tile > svg *{animation-play-state:paused!important}
.badge{position:absolute;display:grid;place-items:center;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.22)}
.num{left:7px;top:7px;min-width:32px;height:32px;padding-inline:6px;background:#FFFFFF;color:#1E2A3B;font-family:var(--font-display);font-weight:600;font-size:1.05rem;font-variant-numeric:tabular-nums}
.hot{right:7px;bottom:7px;width:30px;height:30px;background:#FFE6DA}
.hot svg{width:18px;height:18px}
.check{right:7px;top:7px;width:38px;height:38px;background:var(--accent);transform:scale(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.check svg{width:24px;height:24px;fill:none;stroke:var(--accent-ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24}
.chip{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--warn-bg);color:var(--warn-ink);white-space:nowrap}
.is-done{border-color:var(--accent)}
.is-done .check{transform:scale(1)}
.is-done .check svg{animation:drawCheck .35s ease-out .1s forwards}
@keyframes drawCheck{to{stroke-dashoffset:0}}
.is-next{border-color:var(--noodle-deep);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(246,201,69,0)}50%{box-shadow:0 0 0 8px rgba(246,201,69,.55)}}
.is-locked{opacity:.78;filter:saturate(.6)}
.is-locked:hover{transform:none}
.hear{padding:5px 12px;font-size:.85rem}
.nudge{animation:nudge .5s ease}
@keyframes nudge{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.done-card{margin-top:22px;padding:18px 20px;border-radius:18px;background:var(--next);border:2px solid var(--noodle-deep);display:grid;gap:8px;justify-items:start}
.done-card h3{font-family:var(--font-display);font-weight:600;font-size:1.4rem;margin:0}
.done-card p{margin:0;color:var(--muted)}
.list-foot{margin-top:18px;display:flex;justify-content:flex-end}

/* ---------- Scene animations ---------- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes grow{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes dash{to{stroke-dashoffset:-23}}
@keyframes dash2{to{stroke-dashoffset:-44}}
.stream{animation:dash .45s linear infinite}
.stream.stop-later{animation:dash .45s linear infinite,fadeOut .35s ease 2.9s forwards}
.rub{animation:rub .32s ease-in-out infinite alternate}
@keyframes rub{from{transform:translateX(-2px)}to{transform:translateX(7px)}}
.soap{animation:soap 1.6s ease-out infinite both}
@keyframes soap{0%{transform:translateY(8px) scale(.3);opacity:0}25%{opacity:1}100%{transform:translateY(-46px) scale(1.1);opacity:0}}
.door{transform-origin:0 0;animation:doorOpen .8s ease-in-out .15s both}
@keyframes doorOpen{to{transform:scaleX(.12) skewY(8deg)}}
.pan-move{transform-origin:0 0;animation:panMove 1.5s cubic-bezier(.45,0,.25,1) .9s both}
@keyframes panMove{0%{transform:translate(100px,134px) scale(.42)}50%{transform:translate(240px,58px) scale(.58)}85%{transform:translate(282px,159px) scale(.7)}92%{transform:translate(282px,152px) scale(.7)}100%{transform:translate(282px,159px) scale(.7)}}
.fill-water{animation:fillWater 2.7s ease-out .2s both}
@keyframes fillWater{from{transform:scale(.05);opacity:.2}to{transform:scale(1);opacity:1}}
.slide-in{animation:slideIn 1.4s cubic-bezier(.3,.7,.3,1) both}
@keyframes slideIn{0%{transform:translate(-340px,-50px)}55%{transform:translate(-6px,-34px)}75%{transform:translate(0,0)}86%{transform:translate(0,-7px)}100%{transform:translate(0,0)}}
.knob-turn-on{animation:knobOn .6s ease .15s both}
.knob-turn-off{animation:knobOn .6s ease .2s reverse both}
.knob-on{transform:rotate(-90deg)}
@keyframes knobOn{from{transform:rotate(0)}to{transform:rotate(-90deg)}}
.flame{animation:flicker .5s ease-in-out infinite alternate}
@keyframes flicker{from{transform:scale(1,1)}to{transform:scale(.86,1.15)}}
.flames-appear{transform-origin:200px 214px;animation:grow .5s cubic-bezier(.3,1.4,.5,1) .75s both}
.flames-off{transform-origin:200px 214px;animation:grow .6s ease-in .75s reverse both}
.bub{animation:bub 1.3s ease-out infinite both}
@keyframes bub{0%{transform:scale(0);opacity:0}30%{opacity:1}80%{transform:scale(1.1);opacity:1}100%{transform:scale(1.4);opacity:0}}
.steam{animation:steam 2.4s ease-in-out infinite both}
@keyframes steam{0%{transform:translateY(10px);opacity:0}35%{opacity:.9}100%{transform:translateY(-26px);opacity:0}}
.steam-fade{animation:fadeTo 3s ease 1s both}
@keyframes fadeTo{to{opacity:.2}}
.pop-in{transform-box:fill-box;transform-origin:center;animation:popIn .45s cubic-bezier(.3,1.6,.5,1) .5s both}
.ding{transform-box:fill-box;transform-origin:center;animation:popIn .4s cubic-bezier(.3,1.6,.5,1) 4.3s both}
.shake{animation:shake 2.8s ease-in-out both}
@keyframes shake{0%{transform:rotate(0)}18%{transform:rotate(150deg)}28%{transform:rotate(134deg)}38%{transform:rotate(160deg)}48%{transform:rotate(136deg)}58%{transform:rotate(158deg)}68%{transform:rotate(140deg)}80%{transform:rotate(150deg)}100%{transform:rotate(0)}}
.grain{animation:grain .5s ease-in 3 both}
@keyframes grain{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(30px);opacity:0}}
.box-hop{animation:boxHop 1.9s cubic-bezier(.4,0,.3,1) .2s both}
@keyframes boxHop{0%{transform:translate(0,0)}12%{transform:translate(0,-10px)}20%{transform:translate(0,0)}30%{transform:translate(14px,-26px) rotate(12deg)}65%{transform:translate(118px,-52px) rotate(-8deg)}88%{transform:translate(186px,70px) rotate(0)}94%{transform:translate(186px,63px)}100%{transform:translate(186px,70px)}}
.lower{animation:lower 1.4s cubic-bezier(.3,.8,.4,1) .2s both}
@keyframes lower{from{transform:translateY(-150px)}to{transform:translateY(0)}}
.fan{transform-origin:0 150px;animation:fan .7s ease-out 1.7s both}
@keyframes fan{from{transform:rotate(0)}to{transform:rotate(14deg)}}
.fade-in-late{animation:fadeIn .8s ease 2.1s both}
.stir{animation:stir 1.6s linear infinite}
@keyframes stir{0%,100%{transform:translate(-34px,2px)}25%{transform:translate(0,9px)}50%{transform:translate(34px,2px)}75%{transform:translate(0,-5px)}}
.swirl{animation:swirl .8s ease-in-out infinite alternate}
@keyframes swirl{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
.timer-arc{animation:timer 4s linear .3s both}
@keyframes timer{from{stroke-dashoffset:0}to{stroke-dashoffset:94.25}}
.ring{animation:ring .1s linear 4.3s 10 alternate}
@keyframes ring{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.tilt-pour{animation:tilt .9s ease-in-out .2s both}
@keyframes tilt{from{transform:rotate(0)}to{transform:rotate(-60deg)}}
.pour{animation:fadeIn .25s ease 1s both}
.pour .flow{animation:dash2 .6s linear infinite}
.pile-grow{animation:grow .9s ease-out 1.3s both}
.pile-shrink{animation:shrink .4s ease .35s both}
@keyframes shrink{to{transform:scale(.7)}}
.drip{animation:drip .8s ease-in infinite both}
@keyframes drip{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(10px);opacity:0}}
.clump-move{animation:clump 1.6s cubic-bezier(.45,0,.3,1) .3s both}
@keyframes clump{0%{transform:translate(0,0);opacity:1}35%{transform:translate(50px,-90px)}70%{transform:translate(150px,-72px)}90%{transform:translate(190px,-12px);opacity:1}100%{transform:translate(190px,-8px);opacity:0}}
.bowl-fill{animation:grow .5s ease-out 1.65s both}
.jar-tilt{animation:jar 3.4s ease-in-out .1s both}
@keyframes jar{0%{transform:rotate(0)}20%{transform:rotate(-120deg)}75%{transform:rotate(-120deg)}100%{transform:rotate(0)}}
.sauce-pour{stroke-dasharray:130;animation:draw .5s ease-out .75s both,fadeOut .35s ease 2.5s forwards}
@keyframes draw{from{stroke-dashoffset:130}to{stroke-dashoffset:0}}
.sauce-grow{animation:grow 1.3s ease-out 1s both}
.bob{animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-9px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .6s ease-in-out infinite alternate}
@keyframes spin{from{transform:scaleX(1)}to{transform:scaleX(.55)}}
.heart{animation:heart 2.4s ease-out infinite both}
@keyframes heart{0%{transform:translateY(0) scale(.5);opacity:0}25%{opacity:1}100%{transform:translateY(-30px) scale(1.1);opacity:0}}

@media (prefers-reduced-motion: reduce){
  #scene svg *{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}
  .is-next .check,.nudge,.toast{animation:none!important}
  #barFill{transition:none}
}
body{margin:0}
img{max-width:100%}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;font-weight:700;font-size:.92rem;color:var(--accent);text-decoration:none;border-radius:8px}
.back:hover{text-decoration:underline}
.back:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <a class="back" href="../index.html">&larr; All recipes</a>
      <h1>Noodle Kitchen</h1>
      <p class="sub">Cook a pot of noodles one step at a time. Tap each step when it's done and watch it happen in the kitchen.</p>
    </div>
    <div class="tools">
    <button type="button" class="pill" id="resetTop">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
      Start over
    </button>
    <button type="button" class="pill" id="soundBtn" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path id="soundWaves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <span id="soundLabel">Sound on</span>
    </button>
    </div>
  </header>

  <div class="progress">
    <svg class="noodle-bar" viewBox="0 0 600 24" preserveAspectRatio="none" aria-hidden="true">
      <path id="barTrack" pathLength="100" d=""/>
      <path id="barFill" pathLength="100" d=""/>
    </svg>
    <span id="progressText" aria-live="polite">0 of 16 steps</span>
  </div>

  <main class="layout">
    <section class="stage-col" aria-label="Kitchen">
      <figure class="stage">
        <div id="scene"></div>
        <button type="button" class="pill replay" id="replay">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
          Play again
        </button>
        <div class="toast" id="toast" role="status" hidden></div>
      </figure>
      <div class="caption">
        <div class="cap-meta"><span id="capStep">Ready to cook</span><span class="chip" id="capChip" hidden>Grown-up helps</span>
          <button type="button" class="pill hear" id="hearBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/></svg>Hear it</button></div>
        <h2 id="capTitle">Let's make noodles</h2>
        <p id="capHint">Tap step 1 when your hands are clean.</p>
      </div>
    </section>

    <section class="list-col" aria-label="Steps">
      <div id="list"></div>
      <div class="done-card" id="doneCard" hidden>
        <h3>Noodles are ready!</h3>
        <p>All 16 steps done. Time to eat.</p>
        <button type="button" class="pill" id="again">Cook again</button>
      </div>
      <div class="list-foot"><button type="button" class="pill" id="reset">Start over</button></div>
    </section>

const FONT='font-family="Fredoka, Trebuchet MS, sans-serif" font-weight="600"';

/* ---------- drawing helpers ---------- */
function wall(){
  let l='';
  for(let y=46;y<222;y+=46) l+=`<line x1="0" y1="${y}" x2="400" y2="${y}"/>`;
  for(let x=50;x<400;x+=50) l+=`<line x1="${x}" y1="0" x2="${x}" y2="222"/>`;
  return `<rect width="400" height="300" fill="${C.wall}"/><g stroke="${C.tile}" stroke-width="2">${l}</g>`;
}
function counter(){
  return `<rect x="0" y="226" width="400" height="74" fill="${C.wood}"/><rect x="0" y="220" width="400" height="10" rx="2" fill="${C.woodEdge}"/>`+
  `<path d="M20 252 h70 M140 270 h90 M280 256 h80 M60 286 h60 M300 284 h50" stroke="${C.woodLine}" stroke-width="2.5" stroke-linecap="round" fill="none"/>`;
}
function knob(x,y,cls){
  return `<g transform="translate(${x} ${y})"><g class="${cls}"><circle r="12" fill="#E7EBF1" stroke="#9AA6B8" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="-9" stroke="${C.ink}" stroke-width="3" stroke-linecap="round"/></g></g>`;
}
function stove(o={}){
  return counter()+
  `<rect x="92" y="220" width="216" height="80" fill="${C.stove}"/>`+
  `<rect x="86" y="214" width="228" height="10" rx="3" fill="${C.stoveTop}"/>`+
  `<ellipse cx="200" cy="215" rx="62" ry="5" fill="#161B26"/>`+
  (o.flames||'')+
  `<rect x="134" y="186" width="132" height="7" rx="3" fill="#1E2432"/>`+
  `<rect x="140" y="191" width="6" height="23" fill="#1E2432"/><rect x="254" y="191" width="6" height="23" fill="#1E2432"/>`+
  `<line x1="130" y1="284" x2="270" y2="284" stroke="#59627A" stroke-width="5" stroke-linecap="round"/>`+
  knob(150,252,o.knob||'')+knob(200,252,'')+knob(250,252,'');
}
function flames(cls){
  let f='';
  [146,173,200,227,254].forEach((x,i)=>{
    f+=`<g transform="translate(${x} 214)"><g class="flame" style="animation-delay:${(-i*0.13).toFixed(2)}s"><path d="M0 0 C-12 -4 -11 -22 0 -38 C11 -22 12 -4 0 0Z" fill="${C.flame}"/><path d="M0 -2 C-6 -4 -5 -14 0 -23 C5 -14 6 -4 0 -2Z" fill="${C.flameIn}"/></g></g>`;
  });
  return `<g class="${cls||''}">${f}</g>`;
}
function pot(cx,y,o={}){
  const water=o.water!==false, inner=o.inner||'', wc=o.waterCls||'';
  return `<rect x="${cx+68}" y="${y+12}" width="84" height="13" rx="6.5" fill="${C.handle}"/>`+
  `<ellipse cx="${cx}" cy="${y}" rx="75" ry="15" fill="${C.steelDark}"/>`+
  (water?`<ellipse class="${wc}" style="transform-origin:${cx}px ${y+4}px" cx="${cx}" cy="${y+4}" rx="67" ry="10" fill="${C.water}"/>`:'')+
  `<path d="M${cx-75} ${y} A75 15 0 0 1 ${cx+75} ${y}" fill="none" stroke="${C.steelLight}" stroke-width="5"/>`+
  inner+
  `<path d="M${cx-75} ${y} A75 15 0 0 0 ${cx+75} ${y} V${y+72} Q${cx+75} ${y+90} ${cx+57} ${y+90} H${cx-57} Q${cx-75} ${y+90} ${cx-75} ${y+72} Z" fill="${C.steel}"/>`+
  `<path d="M${cx+44} ${y+26} V${y+72}" stroke="${C.steelDark}" stroke-opacity=".22" stroke-width="10" stroke-linecap="round"/>`+
  `<rect x="${cx-60}" y="${y+24}" width="9" height="50" rx="4.5" fill="#fff" opacity=".45"/>`+
  `<path d="M${cx-75} ${y} A75 15 0 0 0 ${cx+75} ${y}" fill="none" stroke="${C.steelLight}" stroke-width="5"/>`;
}
let clipUid=0;
function potNoodles(cx,y,cls){
  let p=''; const cid='wclip'+(++clipUid);
  [-2,3,8].forEach((dy,i)=>{
    const x0=cx-60+i*6;
    p+=`<path d="M${x0} ${y+4+dy} q8 -6 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0" fill="none" stroke="${i%2?C.noodleDark:C.noodle}" stroke-width="3.5" stroke-linecap="round"/>`;
  });
  return `<clipPath id="${cid}"><ellipse cx="${cx}" cy="${y+4}" rx="67" ry="10"/></clipPath><g clip-path="url(#${cid})"><g class="${cls||''}">${p}</g></g>`;
}
function bubbles(cx,y){
  const pts=[[-40,4],[-15,8],[10,2],[35,7],[52,3],[-55,6]];
  return pts.map(([dx,dy],i)=>`<g transform="translate(${cx+dx} ${y+dy})"><circle class="bub" r="4.5" fill="${C.waterLight}" stroke="#fff" stroke-width="1.5" style="animation-delay:${(i*0.23).toFixed(2)}s"/></g>`).join('');
}
function steam(cx,y,cls){
  return `<g class="${cls||''}" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">`+
    [-36,0,36].map((dx,i)=>`<path class="steam" style="animation-delay:${(i*0.6).toFixed(1)}s" d="M${cx+dx} ${y} q-10 -14 0 -28 t0 -28"/>`).join('')+`</g>`;
}
function sink(x1,x2){
  return `<rect x="${x1}" y="220" width="${x2-x1}" height="20" rx="8" fill="#A7B8C7"/><rect x="${x1+10}" y="224" width="${x2-x1-20}" height="12" rx="5" fill="#6F8396"/>`;
}
function faucet(nx,bx){
  return `<path d="M${bx} 222 V150 Q${bx} 126 ${bx-24} 126 H${nx} V146" fill="none" stroke="${C.steel}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>`+
    `<rect x="${bx-8}" y="166" width="38" height="11" rx="5.5" fill="${C.steelDark}"/>`;
}
function hand(){
  return `<rect x="-50" y="-15" width="30" height="30" rx="8" fill="#5B8DEF"/><path d="M-22 -13 H6 a13 13 0 0 1 0 26 H-22 Z" fill="${C.skin}"/><ellipse cx="0" cy="-13" rx="6" ry="8" fill="${C.skin}"/><path d="M2 -3 h8 M2 4 h9" stroke="${C.skinLine}" stroke-width="2" stroke-linecap="round"/>`;
}
function noodleBox(){
  return `<rect x="-21" y="-66" width="42" height="66" rx="4" fill="${C.box}" stroke="${C.boxEdge}" stroke-width="2"/>`+
    `<rect x="-13" y="-54" width="26" height="24" rx="3" fill="#FFF6D6"/>`+
    `<g stroke="${C.noodleDark}" stroke-width="2.5" stroke-linecap="round">${[-8,-3,2,7].map(x=>`<line x1="${x}" y1="-51" x2="${x}" y2="-33"/>`).join('')}</g>`+
    `<text x="0" y="-13" text-anchor="middle" ${FONT} font-size="8" fill="${C.ink}">NOODLES</text>`;
}
function pile(cx,cy,w){
  const h=w*.42; let lines='';
  for(let k=0;k<4;k++){
    const yy=cy-h*.75+k*h*.22, ww=w*(.45+k*.15);
    lines+=`<path d="M${(cx-ww).toFixed(1)} ${yy.toFixed(1)} q${(ww/4).toFixed(1)} -6 ${(ww/2).toFixed(1)} 0 t${(ww/2).toFixed(1)} 0 t${(ww/2).toFixed(1)} 0 t${(ww/2).toFixed(1)} 0" fill="none" stroke="${C.noodleDark}" stroke-width="2.6" stroke-linecap="round"/>`;
  }
  return `<path d="M${cx-w} ${cy} Q${cx-w*.9} ${cy-h*1.3} ${cx} ${cy-h*1.25} Q${cx+w*.9} ${cy-h*1.3} ${cx+w} ${cy} Z" fill="${C.noodle}"/>`+lines;
}
function colander(rx,ry){
  let holes='';
  for(let r=0;r<3;r++){
    const yy=9+r*Math.round(ry/4);
    const half=Math.sqrt(Math.max(0,1-(yy/ry)**2))*rx-12;
    for(let x=-half;x<=half+.1;x+=14) holes+=`<circle cx="${x.toFixed(1)}" cy="${yy}" r="2.6" fill="${C.redDark}"/>`;
  }
  return {
    back:`<rect x="${-rx-16}" y="-5" width="20" height="10" rx="5" fill="${C.redDark}"/><rect x="${rx-4}" y="-5" width="20" height="10" rx="5" fill="${C.redDark}"/><path d="M${-rx} 0 A${rx} ${ry} 0 0 0 ${rx} 0 Z" fill="${C.red}"/>${holes}`,
    rim:`<rect x="${-rx-4}" y="-6" width="${2*rx+8}" height="10" rx="5" fill="${C.redDark}"/>`
  };
}
function bowl(cx,y){
  return `<g transform="translate(${cx} ${y})"><rect x="-22" y="34" width="44" height="8" rx="3" fill="${C.bowlDark}"/><path d="M-62 0 A62 40 0 0 0 62 0 Z" fill="${C.bowl}"/><path d="M-48 16 Q0 32 48 16" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="62" ry="8" fill="${C.bowlDark}"/></g>`;
}
function sauceBlob(){
  return `<path d="M-30 0 C-28 -14 -10 -18 0 -16 C14 -20 30 -12 28 0 C30 8 12 12 0 9 C-14 13 -32 8 -30 0Z" fill="${C.sauce}"/><ellipse cx="-8" cy="-8" rx="7" ry="3" fill="#fff" opacity=".35"/>`;
}
function jarItem(cx,b,fill,lid){
  return `<rect x="${cx-15}" y="${b-34}" width="30" height="34" rx="7" fill="${fill}"/><rect x="${cx-13}" y="${b-40}" width="26" height="8" rx="3" fill="${lid}"/>`;
}

/* ---------- scenes ---------- */

  return wall()+stove()+pot(200,96,{water:false})+
  `<g transform="translate(352 220)">${noodleBox()}</g>`+
  `<g transform="translate(100 22)"><rect width="200" height="44" rx="14" fill="#FFFFFF"/><text x="100" y="29" text-anchor="middle" ${FONT} font-size="18" fill="${C.ink}">Let's make noodles!</text></g>`;
}

  // 1 wash hands
  ()=>wall()+counter()+sink(120,290)+faucet(236,304)+
    `<g transform="translate(70 220)"><rect x="-17" y="-48" width="34" height="48" rx="9" fill="#8FD3B6"/><rect x="-5" y="-60" width="10" height="13" fill="#5FA88A"/><rect x="-5" y="-63" width="22" height="6" rx="3" fill="#5FA88A"/><rect x="-11" y="-34" width="22" height="16" rx="3" fill="#fff" opacity=".85"/></g>`+

    `<rect x="112" y="104" width="64" height="5" rx="2" fill="#E9EEF3"/><rect x="114" y="99" width="60" height="5" rx="2" fill="#DCE3EA"/><rect x="116" y="94" width="56" height="5" rx="2" fill="#E9EEF3"/><rect x="112" y="109" width="64" height="7" rx="2" fill="#DCE3EA"/>`+
    `<g class="pan-move">${pot(0,0,{water:false})}</g>`+
    `<g transform="translate(48 38)"><g class="door"><rect width="154" height="134" rx="3" fill="#D08F58"/><rect x="12" y="12" width="130" height="110" rx="4" fill="none" stroke="${C.cab}" stroke-width="4"/><circle cx="138" cy="67" r="6" fill="#F4D9A0"/></g></g>`,

  // 3 fill with water

  // 6 boil

  // 7 salt
  ()=>{
    const grains=[226,229,232,235,238,231].map((x,i)=>`<g transform="translate(${x} 72)"><circle class="grain" r="2.4" fill="#fff" stroke="#9AA6B8" stroke-width="1" style="animation-delay:${(0.6+i*0.1).toFixed(2)}s"/></g>`).join('');

    `<rect x="24" y="16" width="176" height="206" rx="5" fill="${C.cab}"/><rect x="33" y="25" width="158" height="188" fill="${C.cabIn}"/>`+
    `<rect x="33" y="86" width="158" height="6" fill="${C.cab}"/><rect x="33" y="152" width="158" height="6" fill="${C.cab}"/>`+
    jarItem(56,86,'#F7F2E2','#E3D6B4')+jarItem(98,86,'#C9733F','#A65B2D')+
    `<rect x="132" y="52" width="26" height="34" rx="4" fill="${C.red}"/><rect x="132" y="62" width="26" height="12" fill="#fff"/><rect x="164" y="56" width="20" height="30" rx="4" fill="#7FB069"/>`+
    `<rect x="42" y="104" width="40" height="48" rx="4" fill="#5C9DD6"/><rect x="48" y="114" width="28" height="14" rx="3" fill="#fff" opacity=".85"/>`+
    `<path d="M90 152 V118 l6 -8 h20 l6 8 V152 Z" fill="#D7B98C"/>`+

  // 14 into a bowl

  // 15 sauce

    const hearts=[[300,70],[336,118],[150,96],[272,42],[352,62]].map(([x,y],i)=>`<g transform="translate(${x} ${y})"><path class="heart" style="animation-delay:${(0.4+i*0.45).toFixed(2)}s" d="M0 5 C-11 -4 -7 -15 0 -8 C7 -15 11 -4 0 5Z" fill="#F06A7E"/></g>`).join('');

/* ---------- steps ---------- */
/* v = picture crop (viewBox), tt = moment of the animation the picture shows (seconds) */
const STEPS=[
  {t:'Wash hands at the sink',h:'Scrub with soap while you count to 20.',v:'116 92 240 180',tt:1},
  {t:'Get the deep saucepan from the cupboard',h:'Pick the deep one with the long handle.',v:'20 12 376 282',tt:2.6},
  {t:'Fill the saucepan with water at the tap',h:'Stop a little past halfway.',v:'124 96 248 186',tt:1.6},
  {t:'Put the saucepan on the stove',h:'Set it right in the middle of the burner.',v:'60 50 320 240',tt:2,a:1},
  {t:'Turn on the stove',h:'Click! Here come the flames.',v:'16 90 280 210',tt:2,a:1},
  {t:'Wait for the water to boil',h:'Look for big bubbles and steam.',v:'64 14 288 216',tt:1,a:1},
  {t:'Add a pinch of salt',h:'Just a little shake. This step is optional.',v:'64 0 288 216',tt:1.2,a:1},
  {t:'Get the noodles from the pantry',h:'Find the noodle box on the shelf.',v:'-14 8 290 218',tt:.1},
  {t:'Put the noodles in the boiling water',h:'Slide them in gently so nothing splashes.',v:'64 0 288 216',tt:3,a:1},
  {t:"Stir so they don't stick",h:'Round and round with the big spoon.',v:'64 0 288 216',tt:.5,a:1},
  {t:'Wait for the noodles to cook',h:'Listen for the timer to ding.',v:'0 40 340 255',tt:4.6,a:1},
  {t:'Turn off the stove',h:'Turn the knob all the way back.',v:'20 50 320 240',tt:3,a:1},
  {t:'Drain the noodles in a colander',h:'The water runs away and the noodles stay.',v:'80 54 320 240',tt:2,a:1},
  {t:'Put the noodles in a bowl',h:'Scoop them in with the tongs.',v:'30 40 340 255',tt:1.2},
  {t:'Add the sauce',h:'Pour it right on top.',v:'80 10 320 240',tt:1.6},
  {t:'Serve and eat',h:'Twirl, blow on it, and take a bite!',v:'60 40 300 225',tt:.35}
];
const TOTAL=STEPS.length;
const HOT_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c1 3.4 5.5 6 5.5 11.2A5.5 5.5 0 0 1 12 19.5a5.5 5.5 0 0 1-5.5-5.8c0-2.6 1.4-4 2.6-5.3.3 1.6.9 2.6 2 3.1C11 8.6 11 5.6 12 2.5Z" fill="#F07A2A"/><path d="M12 12.2c1 1.5 2.3 2.5 2.3 4.1a2.3 2.3 0 0 1-4.6 0c0-1.5 1.2-2.6 2.3-4.1Z" fill="#FFD54F"/></svg>';

const $=id=>document.getElementById(id);
const listEl=$('list'), sceneEl=$('scene'), toastEl=$('toast');
let n=0, current=-1, soundOn=true, toastTimer=null;

function svgWrap(inner,label,vb){
  return `<svg viewBox="${vb||'0 0 400 300'}" xmlns="http://www.w3.org/2000/svg" ${label?`role="img" aria-label="${label.replace(/"/g,'&quot;')}"`:'aria-hidden="true" focusable="false"'} preserveAspectRatio="xMidYMid ${vb?'slice':'meet'}">${inner}</svg>`;
}
function buildBar(){
  let d='M8 12 q12 -8 24 0'; for(let i=0;i<23;i++) d+=' t24 0';
  $('barTrack').setAttribute('d',d); $('barFill').setAttribute('d',d);
}
function buildList(){
  listEl.innerHTML='<ol class="tiles">'+STEPS.map((s,i)=>
    `<li><button type="button" class="tile" id="step-${i+1}" data-i="${i}" aria-pressed="false" title="${s.t.replace(/"/g,'&quot;')}">`+
    svgWrap(SCENES[i](),'',s.v)+
    `<span class="badge num" aria-hidden="true">${i+1}</span>`+
    `<span class="badge check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>`+
    (s.a?`<span class="badge hot" aria-hidden="true">${HOT_ICON}</span>`:'')+
    `</button></li>`).join('')+'</ol>';
  // Freeze each picture at the most telling moment of its animation
  listEl.querySelectorAll('.tile').forEach(b=>{
    const svg=b.querySelector('svg'), tt=STEPS[+b.dataset.i].tt*1000;
    if(!svg.getAnimations) return;
    try{ svg.getAnimations({subtree:true}).forEach(a=>{ a.pause(); a.currentTime=tt; }); }catch(e){}
  });
}
function update(){
  document.querySelectorAll('.tile').forEach(b=>{
    const i=+b.dataset.i;
    b.classList.toggle('is-done',i<n); b.classList.toggle('is-next',i===n); b.classList.toggle('is-locked',i>n);
    b.setAttribute('aria-pressed',String(i<n));
    b.setAttribute('aria-label',`${i+1}. ${STEPS[i].t}${i<n?', done':i===n?', next step':', not yet'}`);
  });
  $('barFill').style.strokeDasharray=`${(n/TOTAL*100).toFixed(2)} 100`;
  $('progressText').textContent=n===TOTAL?'All 16 done!':`${n} of ${TOTAL} steps`;
  $('doneCard').hidden=n<TOTAL;
}
function show(i){
  current=i;
  const s=i<0?null:STEPS[i];
  sceneEl.innerHTML=svgWrap(i<0?intro():SCENES[i](), s?s.t:'A kitchen ready for cooking noodles');
  $('capStep').textContent=i<0?'Ready to cook':`Step ${i+1} of ${TOTAL}`;
  $('capTitle').textContent=s?s.t:"Let's make noodles";
  $('capHint').textContent=s?s.h:'Tap step 1 when your hands are clean.';
  $('capChip').hidden=!(s&&s.a);
  $('replay').hidden=i<0;
}
function toast(msg){
  toastEl.hidden=true; void toastEl.offsetWidth;
  toastEl.textContent=msg; toastEl.hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{toastEl.hidden=true},2400);
}
/* ---------- sound: everything is synthesized, timed to each scene's animation ---------- */
const A={ctx:null,master:null,bus:null,noise:null};
function ac(){
  if(!A.ctx){
    const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return null;
    A.ctx=new Ctx();
    const len=A.ctx.sampleRate*2, buf=A.ctx.createBuffer(1,len,A.ctx.sampleRate), ch=buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
    A.noise=buf;
    A.master=A.ctx.createGain(); A.master.gain.value=soundOn?1:0; A.master.connect(A.ctx.destination);
  }
  if(A.ctx.state==='suspended') A.ctx.resume();
  return A.ctx;
}
function stopScene(){
  if(!A.ctx||!A.bus) return;
  const old=A.bus; A.bus=null;
  old.gain.setTargetAtTime(0.0001,A.ctx.currentTime,0.04);
  setTimeout(()=>{try{old.disconnect()}catch(e){}},400);
}
function newBus(){
  const c=ac(); if(!c) return null;
  stopScene();
  A.bus=c.createGain(); A.bus.gain.value=1; A.bus.connect(A.master);
  return A.bus;
}
function noise(b,at,dur,o={}){
  const c=A.ctx, t=c.currentTime+at, vol=o.vol??.3, atk=o.attack??.02, rel=Math.min(o.release??.3,dur*.9);
  const src=c.createBufferSource(); src.buffer=A.noise; src.loop=true;
  const f=c.createBiquadFilter(); f.type=o.type||'bandpass'; f.Q.value=o.q??1;
  f.frequency.setValueAtTime(o.freq||1000,t); if(o.sweepTo) f.frequency.exponentialRampToValueAtTime(o.sweepTo,t+dur);
  const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+atk);
  g.gain.setValueAtTime(vol,t+Math.max(atk,dur-rel)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(b); src.start(t,Math.random()*1.5); src.stop(t+dur+.05);
}
function tone(b,at,o={}){
  const c=A.ctx, t=c.currentTime+at, dur=o.dur??.3;
  const osc=c.createOscillator(); osc.type=o.type||'sine';
  osc.frequency.setValueAtTime(o.freq||440,t); if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t+dur);
  const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(o.vol??.2,t+(o.attack??.01)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(g); g.connect(b); osc.start(t); osc.stop(t+dur+.05);
}
const rnd=(a,z)=>a+Math.random()*(z-a);
const S={
  water:(b,at,dur,vol=.22)=>{noise(b,at,dur,{freq:1400,q:.7,vol,attack:.15});noise(b,at,dur,{type:'lowpass',freq:500,q:.5,vol:vol*.6,attack:.2});},
  blip:(b,at,f,vol=.1)=>tone(b,at,{freq:f,to:f*2.2,dur:.09,vol}),
  bubbles:(b,at,dur,rate=6,vol=.09,lo=300,hi=800)=>{for(let k=0;k<dur*rate;k++) S.blip(b,at+Math.random()*dur,rnd(lo,hi),vol*rnd(.6,1.2));},
  thud:(b,at,vol=.35)=>{tone(b,at,{freq:140,to:55,dur:.22,vol});noise(b,at,.06,{type:'lowpass',freq:900,vol:vol*.5,attack:.003,release:.05});},
  clank:(b,at,vol=.18)=>{[523,1243,1987].forEach((f,i)=>tone(b,at,{freq:f,type:'triangle',dur:.5-i*.12,vol:vol/(i+1),attack:.002}));noise(b,at,.04,{type:'highpass',freq:3000,vol:vol*.6,attack:.002,release:.03});},
  click:(b,at,vol=.25)=>{noise(b,at,.03,{type:'highpass',freq:2500,vol,attack:.001,release:.025});tone(b,at,{freq:1800,type:'square',dur:.03,vol:vol*.25,attack:.001});},
  whoosh:(b,at,dur=.5,vol=.15,from=300,to=2000)=>noise(b,at,dur,{freq:from,sweepTo:to,q:1.2,vol,attack:dur*.4,release:dur*.5}),
  flameOn:(b,at)=>noise(b,at,.7,{type:'lowpass',freq:180,sweepTo:1300,vol:.4,attack:.06,release:.45}),
  hiss:(b,at,dur,vol=.05)=>{noise(b,at,dur,{freq:2600,q:.4,vol,attack:.3,release:.4});noise(b,at,dur,{type:'lowpass',freq:170,vol:vol*1.8,attack:.3,release:.4});},
  rattle:(b,at,vol=.16)=>{for(let k=0;k<4;k++) noise(b,at+k*.028,.022,{type:'highpass',freq:4500,vol,attack:.002,release:.016});},
  scrub:(b,at,vol=.07)=>noise(b,at,.2,{freq:3200,q:1.2,vol,attack:.05,release:.12}),
  splash:(b,at,vol=.3)=>{noise(b,at,.55,{freq:900,sweepTo:350,q:.8,vol,attack:.01,release:.5});S.bubbles(b,at+.1,.5,16,.07);},
  swish:(b,at,vol=.12)=>noise(b,at,.38,{freq:450,sweepTo:1400,q:2,vol,attack:.16,release:.2}),
  tick:(b,at,vol=.14)=>noise(b,at,.015,{type:'highpass',freq:5000,vol,attack:.001,release:.012}),
  bell:(b,at,vol=.22)=>[1318.5,2637,3955].forEach((f,i)=>tone(b,at,{freq:f,dur:1.3-i*.35,vol:vol/(i*1.6+1),attack:.003})),
  glug:(b,at,f=180,vol=.22)=>tone(b,at,{freq:f,to:f*1.8,dur:.12,vol}),
  plop:(b,at,vol=.25)=>{tone(b,at,{freq:420,to:140,dur:.17,vol});noise(b,at,.08,{type:'lowpass',freq:700,vol:vol*.4,attack:.005,release:.06});},
  creak:(b,at,dur=.7,vol=.05)=>{tone(b,at,{freq:150,to:240,type:'sawtooth',dur,vol,attack:.12});tone(b,at+.05,{freq:300,to:430,type:'triangle',dur:dur*.8,vol:vol*.8,attack:.1});},
  munch:(b,at,vol=.2)=>noise(b,at,.09,{freq:1100,q:1.5,vol,attack:.005,release:.07}),
  jingle:(b,at,vol=.13)=>[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(b,at+i*.1,{freq:f,type:'triangle',dur:.45,vol,attack:.01})),
  boing:(b,at,vol=.1)=>tone(b,at,{freq:280,to:720,dur:.18,vol})
};
const SOUNDS=[
  // 1 wash hands: running tap, scrubbing, soap bubbles
  b=>{S.water(b,0,3.4);for(let k=0;k<9;k++) S.scrub(b,.15+k*.32);S.bubbles(b,.4,2.6,4,.05,900,1600);},
  // 2 cupboard creaks open, pan swooshes out and clanks on the counter
  b=>{S.creak(b,.15,.75);S.whoosh(b,1.1,.9,.1,250,1200);S.clank(b,2.2);S.clank(b,2.36,.07);},
  // 3 tap fills the pot, pitch rising as it fills
  b=>{S.water(b,.05,2.9,.16);noise(b,.1,2.8,{freq:450,sweepTo:1700,q:4,vol:.12,attack:.2,release:.3});},
  // 4 slide onto the burner, clank, little bounce
  b=>{S.whoosh(b,0,.9,.1,200,900);S.clank(b,1.05,.22);S.clank(b,1.3,.07);},
  // 5 knob clicks, flames whoomp on, steady hiss
  b=>{S.click(b,.15);S.click(b,.42);S.click(b,.68);S.flameOn(b,.75);S.hiss(b,1.2,3.5);},
  // 6 boiling
  b=>{S.hiss(b,0,6);S.bubbles(b,0,6,7,.09);},
  // 7 salt shaker rattles
  b=>{S.hiss(b,0,4);S.bubbles(b,0,4,4,.06);[.5,.78,1.06,1.34,1.62,1.9].forEach(t=>S.rattle(b,t));},
  // 8 box wiggles, hops, thumps on the counter
  b=>{S.rattle(b,.35,.1);S.boing(b,.75);S.whoosh(b,.8,.8,.08,300,1500);S.thud(b,1.87,.3);S.rattle(b,1.9,.08);},
  // 9 noodles slide in with a splash
  b=>{S.hiss(b,0,4.5);S.bubbles(b,0,4.5,5,.07);S.whoosh(b,.2,.6,.06,1200,400);S.splash(b,.75);},
  // 10 stirring swishes
  b=>{S.hiss(b,0,5);S.bubbles(b,0,5,5,.06);for(let k=0;k<6;k++) S.swish(b,.1+k*.8);},
  // 11 timer ticks, then dings
  b=>{S.hiss(b,0,4.6);S.bubbles(b,0,4.6,5,.06);for(let t=.3;t<4.3;t+=.25) S.tick(b,t);S.bell(b,4.3);S.bell(b,4.75);S.bell(b,5.2);},
  // 12 knob clicks off, flames puff out, hiss fades
  b=>{noise(b,0,1.6,{freq:2600,q:.4,vol:.05,attack:.02,release:1.4});S.click(b,.2);S.click(b,.48);S.whoosh(b,.75,.45,.1,1200,200);},
  // 13 pot tilts, water pours, drips
  b=>{S.whoosh(b,.2,.7,.06,400,1000);S.water(b,1,3.2,.3);S.bubbles(b,1.3,2.6,4,.07,180,380);for(let k=0;k<6;k++) S.blip(b,1.3+k*.4,rnd(1200,1800),.05);},
  // 14 tongs click, noodles plop in the bowl
  b=>{S.click(b,.3,.12);S.click(b,.42,.1);S.whoosh(b,.45,1,.07,300,1200);S.plop(b,1.75);},
  // 15 sauce glugs out and splats
  b=>{S.whoosh(b,.1,.6,.05,300,900);[.8,1.05,1.3,1.55,1.8,2.05,2.3].forEach((t,i)=>S.glug(b,t,170+(i%3)*25));noise(b,1.0,.18,{type:'lowpass',freq:500,vol:.2,attack:.005,release:.15});},
  // 16 happy jingle, munching, mmm
  b=>{S.jingle(b,.4);[1.1,1.28,1.46,2.0,2.18,2.36].forEach(t=>S.munch(b,t));tone(b,2.75,{freq:196,to:262,type:'triangle',dur:.6,vol:.1,attack:.08});}
];
/* ---------- voice: recorded clips embedded in the page; device speech is only a fallback ---------- */
const LINES={intro:"Let's make noodles! Tap the first picture to start.",s1:"First, wash your hands with soap and water.",s2:"Get the big saucepan from the cupboard.",s3:"Fill the saucepan with water.",s4:"Put the saucepan on the stove.",s5:"Turn on the stove. A grown-up can help!",s6:"Wait for the water to boil. Look at all those bubbles!",s7:"Add a little pinch of salt.",s8:"Get the noodles from the pantry.",s9:"Put the noodles in the boiling water.",s10:"Stir the noodles, so they don't stick together.",s11:"Wait for the noodles to cook. Listen for the timer!",s12:"Turn off the stove.",s13:"Drain the noodles in the colander.",s14:"Put the noodles in a bowl.",s15:"Now, add the yummy sauce.",s16:"Time to eat! You made noodles. Great job!",notyet:"Oops, not yet!",again:"Let's cook again!"};
let VOICE={}; try{ VOICE=JSON.parse(document.getElementById('voices').textContent); }catch(e){}
const vCache={}; let vSources=[], vToken=0;
function decodeClip(key){
  if(vCache[key]) return vCache[key];
  const c=ac(); if(!c||!VOICE[key]) return Promise.reject(new Error('no clip'));
  const bin=atob(VOICE[key]), u8=new Uint8Array(bin.length);
  for(let k=0;k<bin.length;k++) u8[k]=bin.charCodeAt(k);
  vCache[key]=new Promise((res,rej)=>c.decodeAudioData(u8.buffer,res,rej));
  vCache[key].catch(()=>{delete vCache[key]});
  return vCache[key];
}
function stopVoice(){
  vToken++;
  vSources.forEach(s=>{try{s.stop()}catch(e){}}); vSources=[];
  try{ window.speechSynthesis&&window.speechSynthesis.cancel(); }catch(e){}
}
function speakFallback(keys){
  try{
    const s=window.speechSynthesis; if(!s) return;
    const vs=s.getVoices().filter(v=>/^en/i.test(v.lang));
    const pick=vs.find(v=>/natural|neural|premium|enhanced/i.test(v.name))||vs.find(v=>/Samantha|Ava|Zoe|Allison|Google US English/i.test(v.name))||vs[0];
    keys.forEach(k=>{ const u=new SpeechSynthesisUtterance(LINES[k]); if(pick) u.voice=pick; u.rate=.95; u.pitch=1.05; s.speak(u); });
  }catch(e){}
}
async function say(keys){
  if(!soundOn) return;
  stopVoice(); const token=vToken;
  let bufs;
  try{ bufs=await Promise.all(keys.map(decodeClip)); }
  catch(e){ if(token===vToken) speakFallback(keys); return; }
  if(token!==vToken||!soundOn) return;
  const c=A.ctx; let t=c.currentTime+.06;
  bufs.forEach(b=>{
    const src=c.createBufferSource(); src.buffer=b; src.connect(A.master); src.start(t); t+=b.duration+.08; vSources.push(src);
  });
  if(A.bus){ // tuck the sound effects under the voice
    A.bus.gain.cancelScheduledValues(c.currentTime);
    A.bus.gain.setTargetAtTime(.35,c.currentTime,.05);
    A.bus.gain.setTargetAtTime(1,t,.25);
  }
}
function playScene(i){
  if(!soundOn||i<0||!SOUNDS[i]) { stopScene(); return; }
  try{ const b=newBus(); if(b) SOUNDS[i](b); }catch(e){}
}
function bonk(){
  if(!soundOn) return;
  try{ if(ac()){ tone(A.master,0,{freq:220,to:180,dur:.25,vol:.12}); tone(A.master,.12,{freq:196,to:160,dur:.3,vol:.1}); } }catch(e){}
}

listEl.addEventListener('click',e=>{
  const b=e.target.closest('.tile'); if(!b) return;
  const i=+b.dataset.i;
  if(i===n){ n++; update(); show(i); playScene(i); say(['s'+(i+1)]); }
  else if(i<n){ show(i); playScene(i); say(['s'+(i+1)]); }
  else {
    toast('First: '+STEPS[n].t);
    const nb=$('step-'+(n+1)); nb.classList.remove('nudge'); void nb.offsetWidth; nb.classList.add('nudge');
    bonk(); say(['notyet','s'+(n+1)]);
  }
});
listEl.addEventListener('animationend',e=>{ if(e.animationName==='nudge') e.target.classList.remove('nudge'); });
$('replay').addEventListener('click',()=>{ show(current); playScene(current); say([current<0?'intro':'s'+(current+1)]); });
$('hearBtn').addEventListener('click',()=>say([current<0?'intro':'s'+(current+1)]));
function reset(){
  n=0; stopScene(); stopVoice(); toastEl.hidden=true;
  update(); show(-1);
  window.scrollTo({top:0,behavior:'smooth'});
  toast('Fresh start! Tap step 1.');
  say(['again']);
}
$('reset').addEventListener('click',reset);
$('resetTop').addEventListener('click',reset);
$('again').addEventListener('click',reset);
$('soundBtn').addEventListener('click',()=>{
  soundOn=!soundOn;
  $('soundBtn').setAttribute('aria-pressed',String(soundOn));
  $('soundLabel').textContent=soundOn?'Sound on':'Sound off';
  $('soundWaves').style.opacity=soundOn?1:0.2;
  if(A.master) A.master.gain.setTargetAtTime(soundOn?1:0,A.ctx.currentTime,0.03);
  if(!soundOn){ stopScene(); stopVoice(); }
});

buildBar(); buildList(); update(); show(-1);
})();
</script>

</body>
</html>
